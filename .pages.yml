# Pages CMS config (https://pagescms.org). Log in at https://app.pagescms.org with GitHub
# and open hansfigo/gogofigo-web. Every save is a commit; Cloudflare Pages rebuilds the site.

media:
  - name: works
    label: Artwork images
    input: src/assets/works
    output: /src/assets/works
    rename: safe
    extensions: [jpg, jpeg, png, webp]

content:
  - name: works
    label: Works
    type: collection
    path: src/content/works
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      fields: [image, title, year, medium]
      primary: title
      sort: [order, year]
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: image
        label: Image
        type: image
        required: true
        description: JPG, long edge around 2500px, under 3 MB (bigger uploads fail). The site makes smaller versions itself.
        options:
          media: works
      - name: alt
        label: Alt text
        type: text
        required: true
        description: What is in the picture, for people using screen readers. One sentence.
      - name: year
        label: Year
        type: number
        required: true
      - name: medium
        label: Medium
        type: select
        required: true
        options:
          values:
            - name: digital
              label: Digital
            - name: acrylic
              label: Acrylic on canvas
      - name: size
        label: Size
        type: string
        description: Canvases only, for example 40×60 cm.
      - name: description
        label: Description
        type: string
        description: Optional, one short line.
      - name: order
        label: Order
        type: number
        description: Optional. Lower numbers show first. Empty means newest year first.
      - name: featured
        label: Featured
        type: boolean
        default: false
        hidden: true
      - name: placeholder
        label: Placeholder
        type: boolean
        default: false
        description: Sample art only. Turn off (or delete the work) once real art is in.
      - name: body
        label: Notes
        type: text
        hidden: true

  - name: events
    label: Events
    type: collection
    path: src/content/events
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      fields: [title, date, location]
      primary: title
      sort: date
      order: desc
    fields:
      - name: title
        label: Event
        type: string
        required: true
      - name: date
        label: Start date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: endDate
        label: End date
        type: date
        default: ""
        description: Optional, for events longer than one day.
        options:
          format: yyyy-MM-dd
      - name: location
        label: Location
        type: string
        required: true
      - name: booth
        label: Booth
        type: string
      - name: description
        label: Description
        type: string
        description: Optional, one short line.
      - name: link
        label: Link
        type: string
        description: Optional, full URL starting with https://
      - name: body
        label: Notes
        type: text
        hidden: true

  - name: settings
    label: Settings
    type: file
    path: src/data/settings.json
    format: json
    fields:
      - name: commission
        label: Commission
        type: object
        fields:
          - name: open
            label: Commissions open
            type: boolean
          - name: vgenUrl
            label: VGen link
            type: string
            required: true
          - name: tiers
            label: Prices
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{name}: {priceFrom}"
            fields:
              - name: name
                label: Type
                type: string
                required: true
              - name: priceFrom
                label: Price
                type: string
                required: true
                description: As shown on the site, for example "from $40".
      - name: tagline
        label: Tagline
        type: string
        description: Shown under the name. Keep it a few words.
      - name: bio
        label: Bio
        type: text
        list: true
        description: One paragraph per item. Keep it short.
      - name: email
        label: Email
        type: string
      - name: socials
        label: Socials
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{label}"
        fields:
          - name: label
            label: Name
            type: string
            required: true
          - name: handle
            label: Handle
            type: string
          - name: href
            label: Link
            type: string
            required: true
